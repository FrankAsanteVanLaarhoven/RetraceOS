[project]
name = "retrace"
version = "0.1.0"
description = "Scientific evidence workbench for recovering analyses without silently changing what they mean."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Frank Asante Van Laarhoven" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "pandas>=2.2",
  "python-multipart>=0.0.12",
  "jupyter-client>=8.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
retrace-api = "retrace.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrace = ["locales.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
